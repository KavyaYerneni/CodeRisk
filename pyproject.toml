[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coderisk"
version = "0.1.0"
description = "ML pull-request risk classifier"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kavya Yerneni", email = "kavya.yerneni@sjsu.edu" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=14,<20",
  "scikit-learn>=1.4,<2",
  "xgboost>=2.0,<3",
  "torch>=2.1,<3",
  "transformers>=4.38,<5",
  "onnx>=1.15,<2",
  "onnxruntime>=1.17,<2",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.5,<3",
  "pydantic-settings>=2.1,<3",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=4.1,<6",
  "ruff>=0.3,<1",
  "mypy>=1.8,<2",
  "types-PyYAML>=6.0",
  "types-requests>=2.31",
  "pre-commit>=3.6,<4",
]

[project.scripts]
coderisk = "coderisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
packages = ["coderisk"]
mypy_path = "src"

[tool.coverage.run]
source = ["coderisk"]
branch = true
