services:
  api:
    build: .
    image: coderisk:local
    ports:
      - "8742:8742"
    environment:
      CODERISK_MODEL_DIR: /models
      CODERISK_LOG_LEVEL: INFO
    volumes:
      # Host-trained artifacts (never bake secrets or large datasets into the image)
      - ./artifacts/xgboost:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8742/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
