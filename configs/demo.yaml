seed: 42
mode: demo
dataset:
  n_samples: 120
  positive_rate: 0.35
  output_dir: data/processed/demo
split:
  strategy: repository_time
  test_size: 0.2
  val_size: 0.1
xgboost:
  n_estimators: 80
  max_depth: 4
  learning_rate: 0.08
  subsample: 0.9
  colsample_bytree: 0.9
  min_child_weight: 2
  reg_lambda: 1.0
  scale_pos_weight: null  # auto from class balance when null
codebert:
  model_name: microsoft/codebert-base
  max_length: 256
  epochs: 1
  batch_size: 4
  grad_accum: 2
  learning_rate: 2.0e-5
  max_train_samples: 64
api:
  host: 0.0.0.0
  port: 8742
  max_diff_chars: 50000
